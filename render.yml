services:
    - type: web
      name: production-rag-1
      runtime: python
      region: chicago
      plan: free
      buildCommand: pip install uv && uv sync --frozen --no-dev
      startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
      envVars:
          - key: PYTHON_VERSION
            value: "3.13"
          - key: APP_ENV
            value: production
          - key: LOG_LEVEL
            value: INFO
          - key: RATE_LIMIT
            value: "20/minute"
          - key: CACHE_TTL_SECONDS
            value: "3600"
          - key: MAX_RETRIES
            value: "3"
          - key: PRIMARY_MODEL
            value: gpt-4o-mini
          - key: FALLBACK_MODEL
            value: gpt-4o-mini
          # Secrets: sync: false makes Render ask for the value in its dashboard.
          # (value: false would set the variable to the literal string "false".)
          - key: OPENAI_API_KEY
            sync: false
          - key: LANGCHAIN_API_KEY
            sync: false
          - key: LANGCHAIN_TRACING_V2
            value: "true"
          - key: LANGCHAIN_PROJECT
            value: "production-rag-1"
      healthCheckPath: /health
      autoDeploy: true
